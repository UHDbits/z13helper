name: Linux Release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.92.0

      - uses: Swatinem/rust-cache@v2

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            gcc \
            libadwaita-1-dev \
            libbpf-dev \
            libgdk-pixbuf-2.0-dev \
            libgtk-4-dev \
            libwayland-dev \
            librsvg2-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            meson \
            ninja-build \
            pkg-config \
            wayland-protocols

      - name: Build GTK4 Layer Shell 1.3.0
        run: |
          curl -fsSL https://github.com/wmww/gtk4-layer-shell/archive/refs/tags/v1.3.0.tar.gz |
            tar -xz -C /tmp
          meson setup /tmp/gtk4-layer-shell-1.3.0/build /tmp/gtk4-layer-shell-1.3.0 \
            --buildtype=release \
            -Dintrospection=false \
            -Dvapi=false
          meson compile -C /tmp/gtk4-layer-shell-1.3.0/build
          sudo meson install -C /tmp/gtk4-layer-shell-1.3.0/build
          sudo ldconfig

      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | \
            python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "z13helper"))')
          test "$GITHUB_REF_NAME" = "v$version"

      - name: Build release executables
        run: scripts/build-release.sh

      - uses: actions/upload-artifact@v4
        with:
          name: z13helper-x86_64-linux
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
