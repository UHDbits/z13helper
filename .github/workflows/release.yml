name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v22

      - uses: cachix/cachix-action@v17
        with:
          name: z13helper
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          useDaemon: false

      - uses: dtolnay/rust-toolchain@1.92.0

      - uses: Swatinem/rust-cache@v2

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            gcc \
            libadwaita-1-dev \
            libbpf-dev \
            libgdk-pixbuf-2.0-dev \
            libgtk-4-dev \
            libwayland-dev \
            librsvg2-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            meson \
            ninja-build \
            pkg-config \
            wayland-protocols

      - name: Build GTK4 Layer Shell 1.3.0
        run: |
          curl -fsSL https://github.com/wmww/gtk4-layer-shell/archive/refs/tags/v1.3.0.tar.gz |
            tar -xz -C /tmp
          meson setup /tmp/gtk4-layer-shell-1.3.0/build /tmp/gtk4-layer-shell-1.3.0 \
            --buildtype=release \
            -Dintrospection=false \
            -Dvapi=false
          meson compile -C /tmp/gtk4-layer-shell-1.3.0/build
          sudo meson install -C /tmp/gtk4-layer-shell-1.3.0/build
          sudo ldconfig

      - name: Verify release tag
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | \
            python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "z13helper"))')
          test "$GITHUB_REF_NAME" = "v$version"

      - name: Build release executables
        run: scripts/build-release.sh

      - name: Build and publish Nix release
        run: |
          output=$(nix build --no-link --print-out-paths .#z13helper)
          cachix push z13helper "$output"
          cachix pin z13helper "$GITHUB_REF_NAME" "$output"

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
