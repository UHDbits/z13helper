name: CI

on:
  push:
    branches: [main, master]
    paths-ignore: ["**/*.md"]
  pull_request:
    branches: [main, master]
    paths-ignore: ["**/*.md"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            gcc \
            libadwaita-1-dev \
            libbpf-dev \
            libgdk-pixbuf-2.0-dev \
            libgtk-4-dev \
            libwayland-dev \
            librsvg2-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            meson \
            ninja-build \
            pkg-config \
            wayland-protocols

      - name: Build GTK4 Layer Shell 1.3.0
        run: |
          curl -fsSL https://github.com/wmww/gtk4-layer-shell/archive/refs/tags/v1.3.0.tar.gz |
            tar -xz -C /tmp
          meson setup /tmp/gtk4-layer-shell-1.3.0/build /tmp/gtk4-layer-shell-1.3.0 \
            --buildtype=release \
            -Dintrospection=false \
            -Dvapi=false
          meson compile -C /tmp/gtk4-layer-shell-1.3.0/build
          sudo meson install -C /tmp/gtk4-layer-shell-1.3.0/build
          sudo ldconfig

      - name: Test and lint
        run: make test lint

      - name: Verify systemd units
        run: systemd-analyze verify contrib/z13helper.service contrib/systemd/z13helperd.service
