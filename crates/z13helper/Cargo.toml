[package]
name = "z13helper"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "G-Helper-style GTK4 control panel for the ROG Flow Z13"

[[bin]]
name = "z13helper"
path = "src/main.rs"

[dependencies]
z13helper-client = { path = "../z13helper-client" }
z13helper-core = { path = "../z13helper-core" }
anyhow = { workspace = true }
gtk4 = { version = "0.11.4", features = ["v4_14"] }
libadwaita = { version = "0.9.2", features = ["v1_5"] }
glib = "0.22.8"
gio = "0.22.8"
gdk4 = "0.11.4"
gtk4-layer-shell = "0.8.0"
gdk4-x11 = "0.11.4"
x11rb = "0.14.0"
zbus.workspace = true
async-channel = "2.5.0"
tracing.workspace = true
