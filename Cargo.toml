[workspace]
resolver = "2"
members = [
    "crates/z13ctl-client",
    "crates/z13-helper-core",
    "crates/z13-helper",
]
default-members = ["crates/z13-helper"]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"
repository = "https://github.com/dahui/z13gg"

[workspace.dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.12"
anyhow = "1.0.98"
